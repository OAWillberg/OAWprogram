<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAWProgram – Ylläpito</title>
<style>body{font-family:Arial;background:#f4f4f4;margin:0}.box{max-width:700px;margin:30px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 5px 25px #0001}label{display:block;font-weight:bold;margin-top:18px}input,textarea{width:100%;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:8px;font-size:16px;box-sizing:border-box}textarea{min-height:180px}button{margin:18px 6px 0 0;padding:12px 18px;border:0;border-radius:8px;background:#222;color:#fff;font-size:16px}.item{padding:12px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;gap:10px}.hint{color:#666}</style></head>
<body><div class="box"><h1>OAWProgram – ylläpito</h1><p class="hint">Valitse päivä, kirjoita teksti ja tallenna. Lopuksi lataa texts.json ja korvaa GitHubissa vanha tiedosto sillä.</p>
<label>Päivä</label><input id="day" type="date"><label>Otsikko</label><input id="title" placeholder="Esim. Maanantai"><label>Teksti</label><textarea id="body" placeholder="Kirjoita päivän teksti tähän..."></textarea>
<button onclick="save()">Tallenna päivä</button><button onclick="download()">Lataa valmis texts.json</button><h2>Tallennetut päivät</h2><div id="list"></div></div>
<script>
let data={};
async function start(){try{data=await fetch("data/texts.json?"+Date.now()).then(r=>r.json())}catch(e){};render()}
function save(){if(!day.value)return alert("Valitse päivä.");data[day.value]={title:title.value,body:body.value};render();alert("Tallennettu. Lataa lopuksi texts.json ja päivitä se GitHubiin.")}
function edit(d){day.value=d;title.value=data[d].title||"";body.value=data[d].body||"";scrollTo(0,0)}
function del(d){if(confirm("Poistetaanko "+d+"?")){delete data[d];render()}}
function render(){list.innerHTML=Object.keys(data).sort().map(d=>"<div class='item'><span><b>"+d+"</b> – "+(data[d].title||"")+"</span><span><button onclick="edit('"+d+"')">Muokkaa</button><button onclick="del('"+d+"')">Poista</button></span></div>").join("")||"<p>Ei vielä päiviä.</p>"}
function download(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="texts.json";a.click()}
start();
</script></body></html>
